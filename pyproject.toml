[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crane-llm"
description = "CRANE-LLM: runtime-augmented crash prediction and diagnosis for ML notebooks"
# The repository README covers the paper artefacts and the experiment pipeline
# as well as the extension. This one is the project page someone lands on after
# `pip install`, so it describes the extension alone, and uses absolute links
# because PyPI resolves relative ones against pypi.org.
readme = "README_PYPI.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
dynamic = ["version"]
authors = [{ name = "PELAB, Linköping University" }]
keywords = ["jupyter", "jupyterlab", "jupyterlab-extension", "notebook", "llm", "crash-prediction"]
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
]
# JupyterLab is not a dependency. The toolbar button needs it, but the prebuilt
# frontend in the wheel is picked up by whichever JupyterLab 4 is installed, and
# hosted kernels (Kaggle, Colab) cannot load the frontend at all: they use the
# %%crane_llm magic, which needs only IPython, and a second Jupyter stack in
# them would be dead weight that can conflict with the image. The `lab` extra
# below is for a fresh environment.
dependencies = [
    "ipython>=8.5",
    "nbformat>=5.7",
    # The OpenAI SDK is also the client for every OpenAI-compatible endpoint
    # (OpenRouter, Groq, Together, Azure, vLLM, Ollama), so one dependency
    # covers all of the providers the extension can talk to.
    "openai>=1.40",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# `pip install crane-llm[lab]` in an environment with no JupyterLab yet.
lab = ["jupyterlab>=4.0.0,<5"]
# Needed to rebuild the frontend bundle, not to run it.
build = ["jupyter-builder>=1.0.0,<2"]
# Runs tests/. pandas, NumPy and scikit-learn are optional there: the cases
# that need them are skipped without them.
test = ["pytest>=7"]
# Batch experiment pipeline (crane_llm/llms/llm_executor.py).
experiments = [
    "google-genai",
    "ollama",
    "torch",
    "transformers",
]

[project.urls]
Homepage = "https://github.com/yarinamomo/crane_llm"
Repository = "https://github.com/yarinamomo/crane_llm"
Issues = "https://github.com/yarinamomo/crane_llm/issues"

[tool.setuptools]
# Ship only the data files listed under [tool.setuptools.package-data] below.
# Left at its default of true, setuptools instead sweeps in everything under a
# package directory that the sdist manifest happens to include, which picked up
# stray Python scripts from inside node_modules.
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "crane_llm.__version__" }

# Only `crane_llm` is installed. The repository's experiment drivers
# (main.py, main_LLM.py, utils/, results/) are run from a checkout and are
# deliberately not part of the distribution.
[tool.setuptools.packages.find]
include = ["crane_llm", "crane_llm.*"]
# Without this, discovery defaults to including namespace packages and sweeps in
# every directory under the package that has no __init__.py: node_modules, src,
# scripts and the built labextension. That produced thousands of bogus package
# entries. The frontend bundle reaches the install through data_files in
# setup.py, not as a Python package.
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"crane_llm.nb_extension" = ["package.json", "tsconfig.json", "install.json", "src/*.ts", "src/*.json"]
"crane_llm.runinfo_parser" = ["*.json"]
