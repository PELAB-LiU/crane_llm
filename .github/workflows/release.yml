name: release

# Tag a commit to publish it:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The same wheel is attached to a GitHub Release and uploaded to PyPI, so the
# two channels can never drift apart.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the Release and attach the wheel
  id-token: write   # PyPI trusted publishing, which needs no stored token

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build jupyterlab~=4.0

      - name: Build the frontend bundle
        working-directory: crane_llm/nb_extension
        run: |
          jlpm install --immutable
          jlpm build:prod

      - name: Build the wheel and sdist
        run: python -m build

      - name: Check the tag matches the package version
        # Publishing 0.1.0 under the tag v0.2.0 is not recoverable on PyPI,
        # where a version number can never be reused.
        run: |
          python - <<'PY'
          import glob, os, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          wheels = glob.glob("dist/*.whl")
          version = os.path.basename(wheels[0]).split("-")[1]
          print(f"tag={tag} wheel version={version}")
          if tag != version:
              sys.exit(
                  f"tag {tag!r} does not match crane_llm.__version__ {version!r}; "
                  "bump the version in crane_llm/__init__.py or retag"
              )
          PY

      - name: Verify the wheel installs and registers
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/python -m pip install --upgrade pip
          /tmp/check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/check/bin/python -m jupyterlab.labextensions list 2>&1 | tee /tmp/list.txt
          grep -q "crane-llm-jlab.*enabled ok" /tmp/list.txt
          /tmp/check/bin/python -m crane_llm.nb_extension.smoke_test

      - name: Attach the wheel to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        # Configure once at https://pypi.org/manage/account/publishing/ as a
        # trusted publisher for this repository and workflow. No API token is
        # stored anywhere.
        uses: pypa/gh-action-pypi-publish@release/v1
