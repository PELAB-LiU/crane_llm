name: release

# Tag a commit to publish it:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The same wheel is attached to a GitHub Release and uploaded to PyPI, so the
# two channels can never drift apart.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the Release and attach the wheel
  id-token: write   # PyPI trusted publishing, which needs no stored token

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build jupyterlab~=4.0

      - name: Build the frontend bundle
        working-directory: crane_llm/nb_extension
        run: |
          jlpm install --immutable
          jlpm build:prod

      - name: Build the wheel and sdist
        run: python -m build

      - name: Check the PyPI page will render
        # The long description comes from README_PYPI.md. A malformed one is
        # accepted by the upload and then shows as raw text on the project
        # page, which cannot be fixed without publishing a new version.
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Check the tag matches both version numbers
        # Publishing 0.1.0 under the tag v0.2.0 is not recoverable on PyPI,
        # where a version number can never be reused. The frontend carries its
        # own version in package.json, which is what `jupyter labextension list`
        # prints, so it has to agree too or users see one version reported and
        # a different one installed.
        run: |
          python - <<'PY'
          import glob, json, os, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          wheel = os.path.basename(glob.glob("dist/*.whl")[0]).split("-")[1]
          with open("crane_llm/nb_extension/package.json") as fh:
              frontend = json.load(fh)["version"]
          print(f"tag={tag} wheel={wheel} package.json={frontend}")
          problems = []
          if tag != wheel:
              problems.append(
                  f"tag {tag!r} != crane_llm.__version__ {wheel!r} "
                  "(edit crane_llm/__init__.py)"
              )
          if tag != frontend:
              problems.append(
                  f"tag {tag!r} != package.json version {frontend!r} "
                  "(edit crane_llm/nb_extension/package.json)"
              )
          if problems:
              sys.exit("; ".join(problems) + " -- or delete the tag and retag")
          PY

      - name: Verify the wheel installs and registers
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/python -m pip install --upgrade pip
          /tmp/check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/check/bin/python -m jupyterlab.labextensions list > /tmp/list.txt 2>&1 || true
          cat /tmp/list.txt
          python "$GITHUB_WORKSPACE/.github/scripts/check_labextension_listed.py" /tmp/list.txt
          /tmp/check/bin/python -m crane_llm.nb_extension.smoke_test

      - name: Attach the wheel to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        # Configure once at https://pypi.org/manage/account/publishing/ as a
        # trusted publisher for this repository and workflow. No API token is
        # stored anywhere.
        uses: pypa/gh-action-pypi-publish@release/v1
