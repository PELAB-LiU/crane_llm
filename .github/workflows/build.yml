name: build

# Every artifact this project ships is produced here rather than on a
# maintainer's laptop. The frontend bundle is a build output that is not in
# version control, so "it worked locally" says nothing about what a user would
# get from a wheel.

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build jupyterlab~=4.0

      - name: Build the frontend bundle
        working-directory: crane_llm/nb_extension
        run: |
          jlpm install --immutable
          jlpm build:prod

      - name: Build the wheel and sdist
        run: python -m build

      - name: Check the two version numbers agree
        # Caught here on every push rather than at release time, when the only
        # remedy is deleting a tag.
        run: |
          python - <<'PY'
          import json, re, sys
          version = re.search(
              r'__version__\s*=\s*"([^"]+)"', open("crane_llm/__init__.py").read()
          ).group(1)
          with open("crane_llm/nb_extension/package.json") as fh:
              frontend = json.load(fh)["version"]
          print(f"crane_llm.__version__={version} package.json={frontend}")
          if version != frontend:
              sys.exit(
                  "crane_llm/__init__.py and crane_llm/nb_extension/package.json "
                  "must carry the same version"
              )
          PY

      - name: Check the bundle really is in the wheel
        # setup.py already fails the build when the bundle is missing entirely.
        # This catches the subtler case of a wheel that has the directory but
        # not the entry point JupyterLab actually loads.
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          prefix = "share/jupyter/labextensions/crane-llm-jlab/"
          bundled = [n for n in names if prefix in n]
          entry = [n for n in bundled if "static/remoteEntry." in n and n.endswith(".js")]
          print(f"{wheel}: {len(bundled)} bundled files")
          if not entry:
              sys.exit("no static/remoteEntry.*.js in the wheel")
          if not any(n.endswith(prefix + "package.json") for n in bundled):
              sys.exit("no package.json in the bundled extension")
          print("entry point:", entry[0])
          PY

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/python -m pip install --upgrade pip
          /tmp/check/bin/python -m pip install dist/*.whl

      - name: Confirm JupyterLab discovers the extension
        # Run from a directory that is not the checkout, so a passing result
        # cannot come from the source tree being importable by accident.
        run: |
          cd /tmp
          /tmp/check/bin/python -m jupyterlab.labextensions list > /tmp/list.txt 2>&1 || true
          cat /tmp/list.txt
          python "$GITHUB_WORKSPACE/.github/scripts/check_labextension_listed.py" /tmp/list.txt

      - name: Run the backend checks
        run: |
          cd /tmp
          /tmp/check/bin/python -m crane_llm.nb_extension.smoke_test

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
